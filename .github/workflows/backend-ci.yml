name: Backend CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage -- --runInBand
      - run: npm audit --omit=dev
