services:
  postgres:
    container_name: RegistAgro-DB
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./registagro_pgdata:/var/lib/postgresql/data
  
  redis:
    container_name: RegistAgroRedis
    image: redis:8.4.0
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  registagro_pgdata:
  redisdata:
  